parameters:
  - name: frogbotVersion
    type: string
    default: "3.2.2"
  - name: solutionName
    type: string
    default: "netcore-template.sln"
  - name: gitOwner
    type: string
    # GitHub org or user (e.g. my-org). Not the Azure DevOps project name.
  - name: gitRepo
    type: string
    default: ""
    # Leave empty to use $(Build.Repository.Name). Must be repo name only (e.g. AspGoat),
    # not owner/repo — set gitOwner separately.
  - name: gitApiEndpoint
    type: string
    default: "https://api.github.com"
    # GitHub Enterprise: https://github.mycompany.com/api/v3



steps:
  - checkout: self

  # Azure DevOps Windows agents set extensions.worktreeConfig = true in .git/config.
  # Frogbot's go-git library does not support this extension and fails with:
  #   "core.repositoryformatversion does not support extension: worktreeconfig"
  - bash: git config --local --unset extensions.worktreeConfig || true
    displayName: 'Remove worktreeConfig extension (go-git compatibility)'

  # Git Bash on windows-latest — CmdLine/cmd.exe cannot run ./frogbot.exe
  # getFrogbot.sh resolves the binary URL (incl. JF_RELEASES_REPO); only pass it in env.
  - bash: |
      set -e
      curl -fLg "https://releases.jfrog.io/artifactory/frogbot/v3/${{ parameters.frogbotVersion }}/getFrogbot.sh" -o getFrogbot.sh
      # Force OSTYPE=msys so getFrogbot.sh selects frogbot-windows-amd64/frogbot.exe
      # Git Bash on Azure DevOps Windows agents does not set OSTYPE automatically.
      export OSTYPE=msys
      bash getFrogbot.sh ${{ parameters.frogbotVersion }}
      ./frogbot.exe scan-repository
    displayName: 'Frogbotv3 scan-repository'
    env:
      JF_URL: $(JF_URL)
      JF_ACCESS_TOKEN: $(JF_ACCESS_TOKEN)
      JF_GIT_TOKEN: $(JF_GIT_TOKEN)
      JF_RELEASES_REPO: $(JF_RELEASES_REPO)
      JF_GIT_PROVIDER: 'github'
      JF_GIT_OWNER: ${{ parameters.gitOwner }}
      JF_GIT_REPO: ${{ parameters.gitRepo }}
      JF_GIT_API_ENDPOINT: ${{ parameters.gitApiEndpoint }}
      FROGBOT_INSECURE_SKIP_CHECKSUM_VERIFICATION: '1'  